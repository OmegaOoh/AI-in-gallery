<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Album: {{ album_name }}</title>
        <style>
            body {
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
                margin: 0 auto;
                max-width: 1000px;
                padding: 2rem;
                background-color: #fafafa;
                color: #333;
            }
            h1,
            h2 {
                color: #2c3e50;
            }
            .header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 2rem;
                border-bottom: 2px solid #eaeaea;
                padding-bottom: 1rem;
            }
            .back-link {
                text-decoration: none;
                color: #3498db;
                font-weight: bold;
                font-size: 1.1rem;
            }
            .back-link:hover {
                color: #2980b9;
            }
            .upload-section {
                background: #fff;
                padding: 1.5rem;
                border-radius: 8px;
                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
                margin-bottom: 2rem;
            }
            .upload-section input[type="file"] {
                margin-bottom: 1rem;
                display: block;
            }
            .btn {
                padding: 0.5rem 1rem;
                font-size: 1rem;
                background-color: #2ecc71;
                color: white;
                border: none;
                border-radius: 4px;
                cursor: pointer;
            }
            .btn:hover {
                background-color: #27ae60;
            }
            .btn-caption {
                background-color: #9b59b6;
                margin-top: 0.5rem;
                width: 100%;
            }
            .btn-caption:hover {
                background-color: #8e44ad;
            }
            .gallery-container {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                gap: 1.5rem;
            }
            .image-card {
                background: #fff;
                padding: 1rem;
                border-radius: 8px;
                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
                display: flex;
                flex-direction: column;
            }
            .image-card img {
                width: 100%;
                height: 200px;
                object-fit: cover;
                border-radius: 4px;
                margin-bottom: 1rem;
            }
            .caption-container {
                margin-top: 1rem;
                padding: 0.5rem;
                background-color: #f8f9fa;
                border-radius: 4px;
                font-size: 0.95rem;
                color: #555;
                min-height: 2.5rem;
            }
        </style>
    </head>
    <body>
        <div class="header">
            <h1>Album: {{ album_name }}</h1>
            <a href="{{ url_for('index') }}" class="back-link"
                >&larr; Back to Albums</a
            >
        </div>

        <div class="upload-section">
            <h2>Upload Images</h2>
            <form
                action="{{ url_for('upload_file', album_name=album_name) }}"
                method="POST"
                enctype="multipart/form-data"
            >
                <input
                    type="file"
                    name="file"
                    accept="image/*"
                    multiple
                    required
                />
                <button type="submit" class="btn">Upload to Album</button>
            </form>
        </div>

        <h2>Gallery</h2>
        <div class="gallery-container">
            {% for image in images %}
            <div class="image-card">
                <img
                    src="{{ url_for('static', filename='uploads/' ~ album_name ~ '/' ~ image.name) }}"
                    alt="{{ image.name }}"
                />

                {% if image.caption %}
                <div class="caption-container">
                    <strong>Caption:</strong> {{ image.caption }}
                </div>
                {% else %}
                <button
                    class="btn btn-caption"
                    onclick="generateCaption('{{ album_name }}', '{{ image.name }}', 'caption-{{ loop.index }}', this)"
                >
                    Generate Caption ✨
                </button>

                <div id="caption-{{ loop.index }}" class="caption-container">
                    <em>Click the button to generate a caption using ML.</em>
                </div>
                {% endif %}
            </div>
            {% else %}
            <p>No images in this album yet. Upload some above!</p>
            {% endfor %}
        </div>

        <script>
            async function generateCaption(
                albumName,
                filename,
                elementId,
                btnElement,
            ) {
                const captionBox = document.getElementById(elementId);
                captionBox.innerHTML =
                    "<em>Generating caption... Please wait.</em>";

                try {
                    const response = await fetch(
                        `/caption/${encodeURIComponent(albumName)}/${encodeURIComponent(filename)}`,
                    );
                    const data = await response.json();

                    if (response.ok && data.caption) {
                        captionBox.innerHTML = `<strong>Caption:</strong> ${data.caption}`;
                        if (btnElement) btnElement.style.display = "none";
                    } else {
                        captionBox.innerHTML = `<span style="color: #e74c3c;">Error: ${data.error || "Failed to generate caption"}</span>`;
                    }
                } catch (err) {
                    captionBox.innerHTML = `<span style="color: #e74c3c;">Network error occurred.</span>`;
                }
            }
        </script>
    </body>
</html>
